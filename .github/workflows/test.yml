name: Isolated verification

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated build and test dependencies
        run: python -m pip install --upgrade pip build '.[tui,graph]'
      - name: Unit, adversarial and terminal tests
        run: python -m unittest discover -q
      - name: Check whitespace and build artifacts
        run: |
          git diff --check
          python -m build
      - name: Inspect installed command
        run: |
          camol --version
          camol --help
      - name: Runtime recovery soak
        if: matrix.python == '3.12'
        run: python scripts/run_runtime_soak.py --iterations 3 --boxes 4
