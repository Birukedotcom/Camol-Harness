[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "camol-harness"
version = "0.2.0"
description = "A persistent, plan-driven multi-agent orchestration harness."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
tui = ["textual>=8.0,<9"]

[project.scripts]
camol = "camol.cli:main"

[tool.setuptools]
packages = ["camol"]

[tool.setuptools.package-data]
camol = ["assets/*.txt", "assets/profiles/*.json"]
